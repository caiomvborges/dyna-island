[alias]
# Type-check the Windows app from macOS/Linux (no linker needed).
wcheck = "check -p dyna-island --target x86_64-pc-windows-gnu"
wclippy = "clippy -p dyna-island --target x86_64-pc-windows-gnu"
# Build a Windows exe locally (needs mingw-w64: x86_64-w64-mingw32-gcc).
wbuild = "build -p dyna-island --release --target x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
