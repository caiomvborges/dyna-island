name: ci

on:
  push:
  workflow_dispatch:

# A newer push cancels an older run of the same branch. A manual run has its
# own group, so it never cancels a push run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Keep in sync with Cargo.toml's workspace version, installer/dyna-island.nsi and installer/dyna-island.iss.
  DYNA_VERSION: "0.2.4"

jobs:
  core:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dyna-core
      # THIRD-PARTY-NOTICES.txt ships with every build: it must list every
      # crate dyna-island.exe links (run the script after changing dependencies).
      - name: Third-party notices up to date
        run: |
          cargo fetch --locked
          python3 tools/make_notices.py --check

  # dyna-island.exe is built and tested here. The self-tests and smoke runs
  # (tools/) draw on a real desktop and are run by hand on a dev box.
  windows:
    name: Build and test dyna-island.exe (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build -p dyna-island --release

      - name: Unit tests
        run: cargo test --workspace --release

      - name: Upload dyna-island.exe
        uses: actions/upload-artifact@v4
        with:
          name: dyna-island-exe
          path: target/release/dyna-island.exe
          if-no-files-found: error

  installer:
    name: NSIS installer and portable zip
    needs: windows
    # Pinned: 24.04's nsis 3.09 has the amd64-unicode stubs dyna-island.nsi needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dyna-island-exe
          path: dist
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip > /dev/null
          makensis -V2 -DEXE="$PWD/dist/dyna-island.exe" -DOUTDIR="$PWD/dist" installer/dyna-island.nsi
          # Portable build inside its own folder, as tools/package.sh makes it.
          ( cd dist && mkdir DynaIsland && cp dyna-island.exe ../THIRD-PARTY-NOTICES.txt DynaIsland/ && zip -qr "Dyna-Island-$DYNA_VERSION-portable.zip" DynaIsland && rm -rf DynaIsland )
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dyna-island-setup
          path: |
            dist/Dyna-Island-Setup-${{ env.DYNA_VERSION }}.exe
            dist/Dyna-Island-${{ env.DYNA_VERSION }}-portable.zip
          if-no-files-found: error
