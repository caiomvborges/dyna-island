name: ci

on:
  push:
  workflow_dispatch:

# A newer push cancels an older run of the same branch. A manual run has its
# own group, so it never cancels a push run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Keep in sync with Cargo.toml's workspace version, installer/poni.nsi and installer/poni.iss.
  PONI_VERSION: "0.2.4"

jobs:
  core:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p poni-core
      # THIRD-PARTY-NOTICES.txt ships with every build: it must list every
      # crate poni.exe links (run the script after changing dependencies).
      - name: Third-party notices up to date
        run: |
          cargo fetch --locked
          python3 tools/make_notices.py --check

  # poni.exe is built once, here. The unit tests, the self-tests and the
  # installer each run on their own machine, side by side.
  windows:
    name: Build poni.exe (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build -p poni --release

      - name: Upload poni.exe
        uses: actions/upload-artifact@v4
        with:
          name: poni-exe
          path: target/release/poni.exe
          if-no-files-found: error

  # The tests compile the app again, in test mode. They need the same
  # dependencies as the build, so they use its cache (its key is the job id
  # "windows"); only the build saves it.
  unit-tests:
    name: Unit tests (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false

      - name: Unit tests
        run: cargo test --workspace --release

      # Runs one more test from the build above, so it stays on this machine.
      - name: Apple Music's own slider and back button (a stand-in window)
        shell: pwsh
        run: |
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          New-Item -ItemType Directory -Force fake-am | Out-Null
          & "$fw\csc.exe" /nologo /target:winexe /out:fake-am\AppleMusic.exe /r:"$fw\WPF\PresentationFramework.dll" /r:"$fw\WPF\PresentationCore.dll" /r:"$fw\WPF\WindowsBase.dll" /r:"$fw\System.Xaml.dll" tools\fake-apple-music.cs
          if ($LASTEXITCODE -ne 0) { throw "the stand-in didn't build" }
          $env:PONI_FAKE_AM_LOG = "$PWD\fake-am\am.log"
          $am = Start-Process -FilePath fake-am\AppleMusic.exe -ArgumentList "`"$env:PONI_FAKE_AM_LOG`"" -PassThru
          try {
            cargo test -p poni --release presses_apple_musics_own_controls -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Apple Music controls test failed" }
          } finally {
            Stop-Process -Id $am.Id -Force -ErrorAction SilentlyContinue
            Get-Content $env:PONI_FAKE_AM_LOG -ErrorAction SilentlyContinue
          }

  # The self-tests and smoke runs on three machines at once, from the
  # poni.exe built above. Each step is the same as when one machine ran them
  # all in a row; `group` says which machine runs it:
  #   classic: the scripted self-test, the Light self-test, the Pill smoke run
  #   glass:   the Glass self-tests, the Glass smoke run, the Pill self-test
  #   smoke:   the smoke run, the software renderer, the Inno Setup check
  # The Pill steps went to the two machines with the most room; smoke has
  # the longest steps (its smoke run includes the weight check).
  # On CI's software GPU a slow frame doesn't fail a self-test; it shows as a
  # warning on the run page.
  selftest:
    name: Self-tests, ${{ matrix.group }} (Windows)
    needs: windows
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        group: [classic, glass, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poni-exe
          path: target/release

      # The runner is an admin, so Show over games' frame count runs on Light
      # Poni's own frames here: Windows' frame log must deliver them.
      - name: Self-test (scripted screenshots)
        if: matrix.group == 'classic'
        shell: pwsh
        env:
          PONI_SELFTEST_FRAMES: required
        run: |
          # Park the cursor mid-screen so a hover can't change the scripted states.
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCi -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCi.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-out | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-out" -PassThru
          $null = $p.Handle  # keep the handle so ExitCode is available after exit
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Write-Host "self-test did not finish within 120 s"
            $code = -1
          } else {
            $code = $p.ExitCode
          }
          "selftest exit code: $code"

          "---- report.json"
          if (Test-Path selftest-out\report.json) { Get-Content selftest-out\report.json -Raw } else { "(missing)" }
          if (Test-Path selftest-out\report.json) {
            $r = Get-Content selftest-out\report.json -Raw | ConvertFrom-Json
            if ($r.slow_frames) { "::warning title=Slow frames on CI's software GPU (not counted)::$($r.slow_frames -join '; ')" }
          }
          "---- screenshots"
          Get-ChildItem selftest-out -Filter *.png | ForEach-Object { "  $($_.Name)  $($_.Length) bytes" }

          if ($code -ne 0) {
            "---- poni.log (tail)"
            Get-Content selftest-out\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      # The Light theme (cream look, embedded Outfit font).
      - name: Self-test, Light theme
        if: matrix.group == 'classic'
        shell: pwsh
        env:
          PONI_SELFTEST_THEME: light
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiLight -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiLight.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-light | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-light" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "light self-test exit code: $code"
          if (Test-Path selftest-light\report.json) {
            $r = Get-Content selftest-light\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
            if ($r.slow_frames) { "::warning title=Slow frames on CI's software GPU (not counted)::$($r.slow_frames -join '; ')" }
          }
          "---- fonts (poni.log)"
          Select-String -Path selftest-light\home\cache\poni.log -Pattern 'fonts:' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
          if ($code -ne 0) {
            Get-Content selftest-light\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      # The Glass theme over pages the self-test draws itself (no screen copy):
      # a light page in light mode, a dark page in dark mode, and the dark page
      # in light mode (small glass flips dark, the open island stays light).
      # The glass shader runs here (WARP); Wine on a dev box draws smoked glass.
      - name: Self-test, Glass theme
        if: matrix.group == 'glass'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiGlass -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiGlass.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          $env:PONI_SELFTEST_THEME = "glass"
          $failed = 0
          foreach ($run in "light", "dark", "flip") {
            $env:PONI_SELFTEST_GLASS = $run
            $dir = "selftest-glass-$run"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest",$dir -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
            "glass ($run) self-test exit code: $code"
            if (Test-Path "$dir\report.json") {
              $r = Get-Content "$dir\report.json" -Raw | ConvertFrom-Json
              "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
              if ($r.slow_frames) { "::warning title=Slow Glass ($run) frames on CI's software GPU (not counted)::$($r.slow_frames -join '; ')" }
            }
            Select-String -Path "$dir\home\cache\poni.log" -Pattern 'glass:' -ErrorAction SilentlyContinue | Select-Object -First 6 | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              Get-Content "$dir\home\cache\poni.log" -Tail 60 -ErrorAction SilentlyContinue
              $failed = 1
            }
          }
          exit $failed

      # The Pill theme: the island floats below the top edge. Besides the
      # usual checks, its own say the gap above the body shows the screen
      # (pill-gap) and the shadow fades out inside the window
      # (pill-shadow-inside).
      - name: Self-test, Pill theme
        if: matrix.group == 'glass'
        shell: pwsh
        env:
          PONI_SELFTEST_THEME: pill
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiPill -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiPill.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-pill | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-pill" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "pill self-test exit code: $code"
          if (Test-Path selftest-pill\report.json) {
            $r = Get-Content selftest-pill\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
            if ($r.slow_frames) { "::warning title=Slow Pill frames on CI's software GPU (not counted)::$($r.slow_frames -join '; ')" }
            # A theme the self-test doesn't read runs (and passes) as Classic:
            # make sure Pill's own checks ran.
            $pillChecks = @($r.states | ForEach-Object { $_.checks } | Where-Object { $_.name -eq 'pill-gap' }).Count
            "pill-gap checks run: $pillChecks"
            if ($pillChecks -eq 0) { "::error title=Pill self-test::no pill-gap check ran, so this was not a Pill run"; exit 1 }
          }
          if ($code -ne 0) {
            Get-Content selftest-pill\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Smoke run (real desktop, hover, idle CPU/RAM)
        if: matrix.group == 'smoke'
        shell: pwsh
        run: ./tools/ci-smoke.ps1 -Exe target\release\poni.exe -Out smoke-out

      # The Pill theme on a real desktop: the island floats below the top
      # edge, so the smoke run looks for it there, and the gap above it takes
      # the mouse while its shadow lets clicks through (no weight check: that
      # one measures Classic).
      - name: Smoke run, Pill theme
        if: matrix.group == 'classic'
        shell: pwsh
        run: ./tools/ci-smoke.ps1 -Exe target\release\poni.exe -Out smoke-pill -Theme pill

      # Glass on a real desktop: with its screen copy running, screenshots
      # show what's under the island instead of the island.
      - name: Smoke run, Glass theme (left out of screenshots)
        if: matrix.group == 'glass'
        shell: pwsh
        run: ./tools/ci-smoke-glass.ps1 -Exe target\release\poni.exe -Out smoke-glass

      # The GPU renderer is the default (runners draw with WARP). The software
      # renderer is its fallback (no DirectComposition, device loss): test it too.
      - name: Self-test and smoke run, software renderer
        if: matrix.group == 'smoke'
        shell: pwsh
        env:
          PONI_RENDERER: software
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace PoniCiSoft -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [PoniCiSoft.User32]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null

          New-Item -ItemType Directory -Force -Path selftest-soft | Out-Null
          $p = Start-Process -FilePath target\release\poni.exe -ArgumentList "--selftest","selftest-soft" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; $code = -1 } else { $code = $p.ExitCode }
          "software self-test exit code: $code"
          if (Test-Path selftest-soft\report.json) {
            $r = Get-Content selftest-soft\report.json -Raw | ConvertFrom-Json
            "renderer: $($r.renderer); states passed: $($r.states_passed)/$($r.states_total); failed: $($r.failed_checks -join ', ')"
          }
          if ($code -ne 0) {
            Get-Content selftest-soft\home\cache\poni.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }
          ./tools/ci-smoke.ps1 -Exe target\release\poni.exe -Out smoke-soft

      - name: Build installer (Inno Setup)
        if: matrix.group == 'smoke'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          & $iscc "/DAppVersion=$env:PONI_VERSION" installer\poni.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "dist\Dyna-Island-Setup-$env:PONI_VERSION.exe" | Format-List Name, Length

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poni-screens-${{ matrix.group }}
          path: |
            selftest-out
            selftest-light
            selftest-glass-light
            selftest-glass-dark
            selftest-glass-flip
            smoke-glass
            smoke-out
            selftest-soft
            smoke-soft
            selftest-pill
            smoke-pill
          if-no-files-found: warn

      - name: Upload the Inno Setup build (a check; releases ship the NSIS one)
        if: matrix.group == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: poni-setup-inno
          path: dist/Dyna-Island-Setup-${{ env.PONI_VERSION }}.exe
          if-no-files-found: error

  # The three machines' screenshots and logs as one poni-screens download,
  # the same as when one machine ran every self-test.
  screens:
    name: Screenshots and logs in one download
    needs: selftest
    if: ${{ !cancelled() && needs.selftest.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: poni-screens
          pattern: poni-screens-*
          delete-merged: true

  installer:
    name: NSIS installer and portable zip
    needs: windows
    # Pinned: 24.04's nsis 3.09 has the amd64-unicode stubs poni.nsi needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poni-exe
          path: dist
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip > /dev/null
          makensis -V2 -DEXE="$PWD/dist/poni.exe" -DOUTDIR="$PWD/dist" installer/poni.nsi
          # Portable build inside its own folder, as tools/package.sh makes it.
          ( cd dist && mkdir Poni && cp poni.exe ../THIRD-PARTY-NOTICES.txt Poni/ && zip -qr "Dyna-Island-$PONI_VERSION-portable.zip" Poni && rm -rf Poni )
          ls -la dist
      # The download against tools/weight-budget.json (the Windows job's smoke
      # run weighs memory, CPU and wake-ups).
      - name: Weight check, download size
        run: tools/ci-weight-download.sh "dist/Dyna-Island-Setup-$PONI_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dyna-island-setup
          path: |
            dist/Dyna-Island-Setup-${{ env.PONI_VERSION }}.exe
            dist/Dyna-Island-${{ env.PONI_VERSION }}-portable.zip
          if-no-files-found: error
