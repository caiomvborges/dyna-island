[workspace]
resolver = "2"
members = ["crates/dyna-core", "crates/dyna-island"]

[workspace.package]
version = "0.2.4"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Libraries that run for moments and never in a frame, built for size instead
# of speed (AGENTS.md, Keep it light): JSON. Dyna Island's own code keeps opt-level 3.
[profile.release.package.serde_json]
opt-level = "s"
